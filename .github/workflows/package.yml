name: package

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn -B test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build jar and app-image (jpackage)
        shell: pwsh
        run: ./packaging/package-windows.ps1 -NoZip
      # The artifact is downloaded as redmineUpster-windows.zip whose root holds redmineUpster.exe
      - uses: actions/upload-artifact@v4
        with:
          name: redmineUpster-windows
          path: target/package/redmineUpster/
          if-no-files-found: error
          retention-days: 90
