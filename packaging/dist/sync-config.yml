# redmineUpster 設定ファイル（UTF-8 で保存してください。メモ帳なら「UTF-8」を選んで保存）
# 詳しくは USER_GUIDE.md を参照してください。
projects:
  - name: "本番"
    default: true
    redmine:
      # Redmine の URL（ブラウザで開くトップページの URL）
      baseUrl: "https://redmine.example.com"
      # API キー（Redmine の「個人設定」→「APIアクセスキー」）。
      # 環境変数 REDMINE_API_KEY に入れておく場合はこのまま。直接書く場合は "abcd1234..." のように書き換える
      apiKey: "${REDMINE_API_KEY}"
      # 同期先プロジェクトの識別子（プロジェクトの URL の /projects/xxxx の xxxx）
      projectId: "my-project"
    sync:
      # トラッカー列の名前 → トラッカーID（ここにない名前は Redmine のトラッカー名から自動で探す）
      trackerMap:
        "タスク": 2
        "サマリ": 6
      # Excel から消えたチケット（Redmine で手動作成したものを含む）を、このステータスに変更する。
      # 行頭の # を外すと有効。無効のままなら、候補をログに警告として出すだけで何も変更しない
      # deletion:
      #   statusId: 6
      status:
        enabled: true
        mode: "BY_DATES"   # 着手実績・完了実績の有無からステータスを決める
        statusMap:
          "未着手": "1"
          "進行中": "2"
          "完了": "5"
      columns:
        ticketIdColumn: "チケットID"   # 空欄=新規作成（作成したIDが書き戻される）、値あり=更新
        trackerColumn: "トラッカー"
        hierarchy:                      # 親子関係を決める列（浅い順）
          - "大分類"
          - "中分類"
          - "小分類"
          - "成果物"
          - "タスク"
        # 階層列の空欄は「その階層を飛ばす」（例: 大分類の直下のタスク）。同じ値が続く行は各行に書くかセル結合する。
        # true にすると空欄を前の行の値で補う（旧来の動作。この場合は階層を飛ばせない）
        # fillDownHierarchy: false
        startDateColumn: "着手予定"
        dueDateColumn: "完了予定"
        statusColumn: "ステータス"
        progressColumn: "進捗率"
