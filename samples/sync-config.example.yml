projects:
  - name: "本番環境"
    default: true
    redmine:
      baseUrl: "https://redmine.example.com"
      apiKey: "${REDMINE_API_KEY}"  # 環境変数展開対応
      projectId: "project-a"
    sync:
      # 同期・出力する対象の既定（tickets, users, groups のカンマ区切り。--targets が優先。省略時はファイルにある表すべて）
      # "users,groups" にすると、このプロジェクトはユーザー・グループだけをメンテする（users.bat / export-users.bat は常にこの指定）
      # targets: "tickets,users,groups"
      # トラッカー列が空欄の行に使う既定トラッカー（名前またはID）
      tracker:
        enabled: true
        value: "タスク"
      # トラッカー列の名前 → トラッカーID（ここにない名前は Redmine の /trackers.json から解決）
      trackerMap:
        "タスク": 2
        "サマリ": 6
      # Excelから消えたチケットの論理削除（statusIdのステータスへ変更。物理削除はしない）
      # statusId を省略すると、削除候補をログに警告として出すだけで何も変更しません
      deletion:
        statusId: 6  # 例: Redmine標準の「却下」
      # このプロジェクトを更新する Excel/CSV が複数ある場合は、ここにすべて書く（任意）。
      # 書いておくと、1つのファイルだけを同期しても、ほかのファイルのチケットは論理削除しない
      # （論理削除の対象は、ここに書いたどのファイルにも・今回同期したファイルにも・今回作成したチケットにもないものだけ。
      #  ここに書いたファイルを読めない・検証エラーがある場合は、安全のため論理削除を行わない）。
      # --file を省略すると、ここに書いた順にすべて同期する。相対パスはこの設定ファイルのフォルダが基準
      # files:
      #   - "wbs-設計.xlsx"
      #   - "wbs-開発.xlsx"
      # WBS ごとに既存のチケットを「ルートチケット」にできる（最上位の行がそのチケットの子になる。
      #  別プロジェクト（親プロジェクトなど）のチケットも可。CLI の --root-issue=<番号> が優先）。
      #  今回同期するすべてのファイルにルートチケットがあれば、論理削除はルートチケットの配下だけが対象。
      #  ルートチケットとその祖先は論理削除しない
      # files:
      #   - { path: "wbs-設計.xlsx", rootIssueId: 123 }
      #   - { path: "wbs-開発.xlsx", rootIssueId: 124 }
      # 各行に「最終同期日時」「同期結果」「エラー理由」を書き戻す（既定: 有効。dry-run では書かない）。
      # 書き戻さない場合は enabled: false（CLI の --no-result-columns が優先）。列名は columns: で変更できる
      # resultColumns:
      #   enabled: true
      # Excel に親の行がない階層（例: 大分類の行がないタスク）を「仮想親チケット」として自動作成する（既定: 無効）
      # 無効の場合、親の行がないとエラー。CLI の --virtual-parents / --no-virtual-parents が優先
      # 仮想親は毎回「親チケット・件名・トラッカーが同じチケット」を Redmine から探して使う（なければ作成）
      # virtualParents:
      #   enabled: true
      #   trackerId: "サマリ"   # 仮想親のトラッカー（名前またはID。省略時は「サマリ」）
      # 子チケットがすべて完了した親チケットを、同期の最後に自動で完了にする（孫→子→親と再帰的に）。
      # 親の行の「ステータス」列が空欄なら、親のステータスは Redmine の現在値のまま（日付からは決めない）。
      # 行頭の # を外すと有効（既定は無効）。子は Redmine 上のチケットすべて（Excel にないものも含む）で判定し、
      # 完了した親を未完了に戻すことはしない。ルートチケット（rootIssueId）は完了にしない。
      # 完了にした親の行に「ステータス」列があれば、そのステータス名を書き戻す
      # autoCloseParents:
      #   enabled: true
      #   status: "完了"   # 完了にするステータス（名前または番号。省略時は statusMap の「完了」→ Redmine の「完了」「終了」）
      #   # 子に着手済み（新規でない）のチケットがある新規の親は「進行中」にする（inProgress: false で無効）
      #   inProgressStatus: "進行中"   # 省略時は statusMap の「進行中」→ Redmine の「進行中」
      #   # true: Excel にない子チケット（Redmine で手動作成したものなど）を無視して判定する（既定 false。無視した子は変更しない）
      #   ignoreNotInExcel: false
      status:
        enabled: true
        mode: "BY_DATES"  # BY_DATES | FIXED
        fixed: "New"
        statusMap:
          "未着手": "1"
          "進行中": "2"
          "完了": "5"
      customFieldMap:
        チーム: "12"
        工程: "13"
        社/組織: "14"
        着手実績: "15"
        完了実績: "16"
        成果物: "17"
        遅延区分: "20"
      customFieldDateColumns:
        - "着手実績"
        - "完了実績"
      # Excel の読み込み元（省略時は先頭シート。優先順位は table ＞ sheet。CLI の --table= / --sheet= が優先）
      # samples/sample-wbs.xlsx（1枚目「WBS」＝人が見る表、2枚目「取込」＝テーブル「取込表」）を使う場合は table を有効にする
      # excel:
      #   table: "取込表"   # テーブル名（見出し行と範囲だけを読む。数式は計算済みの値を読む）
      #   sheet: "取込"     # シート名 または 1始まりの番号（値のある最初の行がヘッダ）
      # ユーザー・グループの読み込み元（省略時はシート「ユーザー」「グループ」。そのシートがなければ同期しない）
      # --export で出力した Excel はこの名前のシートを作る。変更する場合だけ有効にする
      # users:
      #   sheet: "ユーザー"
      # groups:
      #   sheet: "グループ"
      # グループのメンバー（1行に「グループ名・ログインID」を1組。省略時はシート「グループメンバー」）。
      # このシートに書いたグループは、シートの行がメンバーのすべてになる（ない人はメンバーから外す）。
      # 書いていないグループのメンバーは変更しない。ログインIDが空欄の行だけのグループはメンバー0人にする
      # groupMembers:
      #   sheet: "グループメンバー"
      # 列設定（省略時はデフォルト値を使用）
      columns:
        # チケットID列（空欄=新規作成、値あり=そのチケットを更新。新規作成したIDはここへ書き戻す）
        ticketIdColumn: "チケットID"
        # トラッカー列（行ごとのトラッカー名またはID）
        trackerColumn: "トラッカー"
        # 階層列（浅い順。一番深い値の列がその行のレベル。その値を除いた残りの値と同じ行が親になる）
        hierarchy:
          - "大分類"
          - "中分類"
          - "小分類"
          - "成果物"
          - "タスク"
        # 階層列の空欄は「その階層を飛ばす」（例: 大分類の直下のタスク）。同じ値が続く行は各行に書くかセル結合する。
        # true にすると空欄を前の行の値で補う（旧来の動作。この場合は階層を飛ばせない）
        # fillDownHierarchy: false
        # 同期結果の書き戻し先の列（なければヘッダの末尾に追加。Excel のテーブルはテーブルを右に広げる）。
        # この3列は同期の差分には使わない（値を変えても Redmine は更新されない）
        lastSyncedAtColumn: "最終同期日時"   # yyyy/MM/dd HH:mm:ss（文字列）。1回の実行で全行同じ値
        syncResultColumn: "同期結果"         # 作成／更新／変更なし／エラー／未実行
        syncErrorColumn: "エラー理由"        # エラー・未実行の理由（成功した行は空にする）
        # ---- 標準フィールドの取込列名（WBS の見出しの名前。--export もこの名前で出力する） ----
        # 件名（値があればこの列を件名にする。空欄の行は一番深い階層列の値が件名）
        subjectColumn: "タスク"
        # ステータス（ステータス名またはID。status.statusMap で変換）
        statusColumn: "ステータス"
        # 担当者（ログインID・氏名・メールアドレス・グループ名）
        assigneeColumn: "担当"
        # 開始日・期日（yyyy/M/d、yyyy-MM-dd、Excel の日付）
        startDateColumn: "着手予定"
        dueDateColumn: "完了予定"
        # 着手実績・完了実績（status.mode が BY_DATES でステータス列が空欄のとき、値があれば 進行中／完了 にする）
        startActualColumn: "着手実績"
        dueActualColumn: "完了実績"
        # 進捗率（0〜100。% 付きも可）
        progressColumn: "進捗率"
        # 説明（セル内の改行・Markdown はそのまま。空欄なら Redmine の説明を変更しない）
        descriptionColumn: "説明"
        # 必須列（CSVに必ず含める列）
        required:
          - "チケットID"
          - "トラッカー"
          - "チーム"
          - "工程"
          - "大分類"
          - "中分類"
          - "小分類"
          - "成果物"
          - "タスク"
          - "社/組織"
          - "担当"
          - "着手予定"
          - "着手実績"
          - "完了予定"
          - "完了実績"
        # カスタムフィールドマッピング対象列
        customFieldColumns:
          - "チーム"
          - "工程"
          - "社/組織"
          - "着手実績"
          - "完了実績"
          - "成果物"
          - "遅延区分"

  - name: "テスト環境"
    default: false
    redmine:
      baseUrl: "https://redmine-test.example.com"
      apiKey: "${REDMINE_TEST_API_KEY}"
      projectId: "project-test"
    sync:
      tracker:
        enabled: false
      status:
        enabled: true
        mode: "FIXED"
        fixed: "New"
      customFieldMap: {}
      # 列設定を省略するとデフォルト値が使用されます
