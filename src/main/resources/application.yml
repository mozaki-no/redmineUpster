spring:
  application:
    name: redmineUpster
  main:
    # CLI専用: Webサーバーを起動しない（DBも使わない）
    web-application-type: none
    banner-mode: "off"
  jackson:
    time-zone: Asia/Tokyo

logging:
  level:
    root: WARN

redmine:
  base-url: "${REDMINE_BASE_URL:http://localhost:3000}"
  api-key: "${REDMINE_API_KEY:}"
  project-id: "${REDMINE_PROJECT_ID:}"

sync:
  # 空の場合は --config、なければカレントディレクトリ／実行ファイルと同じフォルダの sync-config.yml を使う
  config-path: "${SYNC_CONFIG_PATH:}"
