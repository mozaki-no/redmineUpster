projects:
  - name: "テスト用プロジェクト"
    default: true
    redmine:
      baseUrl: "http://localhost:3000"
      apiKey: "test-api-key"
      projectId: "test-project"
    sync:
      tracker:
        enabled: true
        value: "タスク"
      status:
        enabled: true
        mode: "BY_DATES"
        fixed: "New"
      customFieldMap: {}
      customFieldDateColumns:
        - "開始日"
      trackerMap:
        "タスク": 2
        "サマリ": 6
      deletion:
        statusId: 6
      columns:
        hierarchy:
          - "大分類"
          - "中分類"
          - "小分類"
          - "成果物"
          - "タスク"
        startDateColumn: "開始日"
        dueDateColumn: "期限"
        statusColumn: "状態"
        progressColumn: "進捗率"
        ticketIdColumn: "Redmine番号"
        trackerColumn: "種別"
        fillDownHierarchy: true
        required:
          - "チケットID"
          - "チーム"
          - "工程"
        customFieldColumns:
          - "チーム"
          - "工程"
